name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["ids-v*", "sociacl-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-policy-store:
    # Match the OS supported by the pinned Playwright browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
        working-directory: typescript/ids
      - run: npx playwright install --with-deps chromium
        working-directory: typescript/ids
      - run: npm run test:browser-store
        working-directory: typescript/ids

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check workspace on minimum supported Rust
        run: cargo check --workspace --all-targets --locked

  test:
    # Public pull_request and push CI must not run on the org self-hosted
    # runner. A fork PR would execute untrusted code on that machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check release versions
        run: python3 scripts/check-release-versions.py

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Check Node 24+
        run: |
          node -v
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-llvm-cov

      - name: Audit sources and test all languages
        run: ./scripts/test-all.sh

      - name: Production install can load sociacl/gun
        working-directory: typescript
        run: |
          npm ci --omit=dev
          node --input-type=module -e "await import('./src/gun.js')"

      - name: Packed install loads every export
        working-directory: typescript
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          pack="$(mktemp -d "$RUNNER_TEMP/sociacl-pack.XXXXXX")"
          npm install --ignore-scripts --prefix "$pack" "$RUNNER_TEMP/sociacl-$version.tgz"
          cd "$pack"
          node --input-type=module -e "
            const root = await import('sociacl');
            const gun = await import('sociacl/gun');
            const group = await import('sociacl/group');
            if (typeof root.HOPCAP !== 'number') throw new Error('root');
            if (typeof gun.admitRow !== 'function') throw new Error('admitRow');
            if (typeof gun.checkSee !== 'function') throw new Error('checkSee');
            if (typeof gun.admitPost !== 'function') throw new Error('admitPost');
            if (typeof gun.checkPost !== 'function') throw new Error('checkPost');
            if (typeof group.MemoryGroupGraph !== 'function') throw new Error('MemoryGroupGraph');
            try {
              await import('sociacl/ir');
              throw new Error('unsigned IR adapter is exported');
            } catch (error) {
              if (error.code !== 'ERR_PACKAGE_PATH_NOT_EXPORTED') throw error;
            }
          "

      - name: Coverage
        run: ./scripts/coverage.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f docs/coverage.md ]]; then
            cat docs/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: |
            docs/coverage.md
            target/coverage/rust-tests.txt
            crates/**/proptest-regressions/**
            target/coverage/rust-summary.txt
            target/coverage/rust.lcov
            target/coverage/python-report.txt
            target/coverage/python.json
            target/coverage/typescript-report.txt
          if-no-files-found: warn

  tag-ids:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No concurrency group. See pack-ids.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # github.token creates the tag in this run. A tag created that way does
      # not start another workflow, so pack-ids publishes only when publish=true.
      # Unprotected master exits 0 without a tag (#60). An existing tag that
      # names another commit stays put; publish stays false until the version changes.
      # A lost create is HTTP 422. The script re-reads the ref and does not move it.
      - name: Tag ids release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/tag-if-absent.sh ids typescript/ids/package.json

  tag-sociacl:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No concurrency group. See pack-ids.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Tag sociacl release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/tag-if-absent.sh sociacl typescript/package.json

  pack-ids:
    needs: [test, msrv, tag-ids]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.msrv.result == 'success' && (startsWith(github.ref, 'refs/tags/ids-v') || (needs.tag-ids.result == 'success' && needs.tag-ids.outputs.publish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # No concurrency group. A group shared with tag-ids keeps one running job
    # and one pending job, and a third master push cancels the pending one.
    # If that pending job is this pack, the tag already exists and later runs
    # set publish=false, so the version never gets a release.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/ids-v') && github.ref_name || needs.tag-ids.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release versions
        run: python3 scripts/check-release-versions.py
      - name: Verify protected release ancestry
        run: scripts/verify-release-ref.sh ids typescript/ids/package.json
      - name: Pack identity package
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix typescript/ids
          version="$(node -p "JSON.parse(require('fs').readFileSync('typescript/ids/package.json')).version")"
          test "$RELEASE_TAG" = "ids-v$version"
          npm run build --prefix typescript/ids
          npm pack --ignore-scripts ./typescript/ids --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" || exit
          sha256sum "sociacl-ids-$version.tgz" > "sociacl-ids-$version.tgz.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: identity-release
          path: |
            ${{ runner.temp }}/sociacl-ids-*.tgz
            ${{ runner.temp }}/sociacl-ids-*.tgz.sha256
          if-no-files-found: error

  pack-sociacl:
    needs: [test, msrv, tag-sociacl]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.msrv.result == 'success' && (startsWith(github.ref, 'refs/tags/sociacl-v') || (needs.tag-sociacl.result == 'success' && needs.tag-sociacl.outputs.publish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # No concurrency group. See pack-ids.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/sociacl-v') && github.ref_name || needs.tag-sociacl.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release versions
        run: python3 scripts/check-release-versions.py
      - name: Verify protected release ancestry
        run: scripts/verify-release-ref.sh sociacl typescript/package.json
      - name: Pack sociacl package
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix typescript
          version="$(node -p "JSON.parse(require('fs').readFileSync('typescript/package.json')).version")"
          test "$RELEASE_TAG" = "sociacl-v$version"
          npm pack --ignore-scripts ./typescript --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" || exit
          sha256sum "sociacl-$version.tgz" > "sociacl-$version.tgz.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sociacl-release
          path: |
            ${{ runner.temp }}/sociacl-*.tgz
            ${{ runner.temp }}/sociacl-*.tgz.sha256
          if-no-files-found: error

  release-ids:
    needs: [pack-ids, tag-ids]
    if: ${{ !cancelled() && needs.pack-ids.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Queue only this tag's publish. A later commit does not enter the group
    # unless it is publishing the same tag.
    concurrency:
      group: release-${{ needs.tag-ids.outputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/ids-v') && github.ref_name || needs.tag-ids.outputs.tag }}
    steps:
      # The write-token job never checks out or executes package source/scripts.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: identity-release
          path: ${{ runner.temp }}/identity-release
      - name: Verify digest and release state
        id: release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/identity-release" || exit
          sha256sum --check sociacl-ids-*.tgz.sha256
          set +e
          err="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" 2>&1 >/dev/null)"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "release ${RELEASE_TAG} already exists; leaving it unchanged"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$err" == *"release not found"* || "$err" == *"HTTP 404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$err" >&2
          exit 1
      - name: Attest build provenance
        if: steps.release.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/identity-release/sociacl-ids-*.tgz
          github-token: ${{ github.token }}
      - name: Publish identity release assets
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/identity-release" || exit
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            sociacl-ids-*.tgz sociacl-ids-*.tgz.sha256

  release-sociacl:
    needs: [pack-sociacl, tag-sociacl]
    if: ${{ !cancelled() && needs.pack-sociacl.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ needs.tag-sociacl.outputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/sociacl-v') && github.ref_name || needs.tag-sociacl.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sociacl-release
          path: ${{ runner.temp }}/sociacl-release
      - name: Verify digest and release state
        id: release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sociacl-release" || exit
          sha256sum --check sociacl-*.tgz.sha256
          set +e
          err="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" 2>&1 >/dev/null)"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "release ${RELEASE_TAG} already exists; leaving it unchanged"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$err" == *"release not found"* || "$err" == *"HTTP 404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$err" >&2
          exit 1
      - name: Attest build provenance
        if: steps.release.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/sociacl-release/sociacl-*.tgz
          github-token: ${{ github.token }}
      - name: Publish sociacl release assets
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sociacl-release" || exit
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            sociacl-*.tgz sociacl-*.tgz.sha256

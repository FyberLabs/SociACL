name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["ids-v*", "sociacl-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check workspace on minimum supported Rust
        run: cargo check --workspace --all-targets --locked

  test:
    # Public pull_request and push CI must not run on the org self-hosted
    # runner. A fork PR would execute untrusted code on that machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard pinned actions and release preparation scheduling
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-check"
          "$RUNNER_TEMP/workflow-check/bin/pip" install -r scripts/requirements-ci.txt
          "$RUNNER_TEMP/workflow-check/bin/python" scripts/check-release-workflow.py
          "$RUNNER_TEMP/workflow-check/bin/python" scripts/check-release-workflow.test.py

      - name: Test package promotion boundaries
        run: python3 scripts/package-channel.test.py

      - name: Check release versions
        run: python3 scripts/check-release-versions.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Check Node 24+
        run: |
          node -v
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Audit sources and run unit/contract tests
        run: ./scripts/test-all.sh

      - name: Production install can load sociacl/gun
        working-directory: typescript
        run: |
          npm ci --omit=dev
          node --input-type=module -e "await import('./src/gun.js')"

      - name: Packed install loads every export
        working-directory: typescript
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          pack="$(mktemp -d "$RUNNER_TEMP/sociacl-pack.XXXXXX")"
          npm install --ignore-scripts --prefix "$pack" "$RUNNER_TEMP/sociacl-$version.tgz"
          cd "$pack"
          node --input-type=module -e "
            const root = await import('sociacl');
            const gun = await import('sociacl/gun');
            const group = await import('sociacl/group');
            if (typeof root.HOPCAP !== 'number') throw new Error('root');
            if (typeof gun.admitRow !== 'function') throw new Error('admitRow');
            if (typeof gun.checkSee !== 'function') throw new Error('checkSee');
            if (typeof gun.admitPost !== 'function') throw new Error('admitPost');
            if (typeof gun.checkPost !== 'function') throw new Error('checkPost');
            if (typeof group.MemoryGroupGraph !== 'function') throw new Error('MemoryGroupGraph');
            try {
              await import('sociacl/ir');
              throw new Error('unsigned IR adapter is exported');
            } catch (error) {
              if (error.code !== 'ERR_PACKAGE_PATH_NOT_EXPORTED') throw error;
            }
          "

  pack-ids:
    needs: [test, msrv]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/ids-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare test package or promote its exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/package-channel.py ids "$RUNNER_TEMP/identity-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-release
          path: ${{ runner.temp }}/identity-release/*
          if-no-files-found: error

  release-ids:
    needs: pack-ids
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-ids-${{ github.ref == 'refs/heads/master' && github.sha || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref == 'refs/heads/master' && format('ids-test-{0}', github.sha) || github.ref_name }}
    steps:
      # No checkout or execution of package source in the write-token job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: identity-release
          path: ${{ runner.temp }}/identity-release
      - name: Verify immutable release assets
        id: release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/identity-release"
          sha256sum --check *.tgz.sha256
          status=0
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2> "$RUNNER_TEMP/release-error" || status=$?
          if [[ "$status" == 0 ]]; then
            previous="$(mktemp -d)"
            trap 'rm -rf "$previous"' EXIT
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$previous"
            for file in *.tgz *.tgz.sha256 release-manifest.json; do
              cmp "$file" "$previous/$file"
            done
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/release-error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
      - name: Attest original test build provenance
        id: provenance
        if: steps.release.outputs.exists == 'false' && github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/identity-release/*.tgz
          github-token: ${{ github.token }}
      - name: Preserve the original signed proof
        if: steps.release.outputs.exists == 'false' && github.ref == 'refs/heads/master'
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/identity-release/provenance.sigstore.json"
      - name: Publish channel package
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/identity-release"
          flags=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            flags=(--target "$GITHUB_SHA" --prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" "${flags[@]}" --generate-notes \
            *.tgz *.tgz.sha256 release-manifest.json provenance.sigstore.json

  pack-sociacl:
    needs: [test, msrv]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/sociacl-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare test package or promote its exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/package-channel.py sociacl "$RUNNER_TEMP/sociacl-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sociacl-release
          path: ${{ runner.temp }}/sociacl-release/*
          if-no-files-found: error

  release-sociacl:
    needs: pack-sociacl
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-sociacl-${{ github.ref == 'refs/heads/master' && github.sha || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref == 'refs/heads/master' && format('sociacl-test-{0}', github.sha) || github.ref_name }}
    steps:
      # No checkout or execution of package source in the write-token job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sociacl-release
          path: ${{ runner.temp }}/sociacl-release
      - name: Verify immutable release assets
        id: release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sociacl-release"
          sha256sum --check *.tgz.sha256
          status=0
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2> "$RUNNER_TEMP/release-error" || status=$?
          if [[ "$status" == 0 ]]; then
            previous="$(mktemp -d)"
            trap 'rm -rf "$previous"' EXIT
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$previous"
            for file in *.tgz *.tgz.sha256 release-manifest.json; do
              cmp "$file" "$previous/$file"
            done
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/release-error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
      - name: Attest original test build provenance
        id: provenance
        if: steps.release.outputs.exists == 'false' && github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/sociacl-release/*.tgz
          github-token: ${{ github.token }}
      - name: Preserve the original signed proof
        if: steps.release.outputs.exists == 'false' && github.ref == 'refs/heads/master'
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/sociacl-release/provenance.sigstore.json"
      - name: Publish channel package
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sociacl-release"
          flags=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            flags=(--target "$GITHUB_SHA" --prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" "${flags[@]}" --generate-notes \
            *.tgz *.tgz.sha256 release-manifest.json provenance.sigstore.json

name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["ids-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Public pull_request and push CI must not run on the org self-hosted
    # runner. A fork PR would execute untrusted code on that machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Check Node 24+
        run: |
          node -v
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-llvm-cov

      - name: Audit sources and test all languages
        run: ./scripts/test-all.sh

      - name: Production install can load sociacl/gun
        working-directory: typescript
        run: |
          npm ci --omit=dev
          node --input-type=module -e "await import('./src/gun.js')"

      - name: Packed install loads every export
        working-directory: typescript
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          pack="$(mktemp -d "$RUNNER_TEMP/sociacl-pack.XXXXXX")"
          npm install --ignore-scripts --prefix "$pack" "$RUNNER_TEMP/sociacl-$version.tgz"
          cd "$pack"
          node --input-type=module -e "
            const root = await import('sociacl');
            const gun = await import('sociacl/gun');
            const group = await import('sociacl/group');
            if (typeof root.HOPCAP !== 'number') throw new Error('root');
            if (typeof gun.admitRow !== 'function') throw new Error('admitRow');
            if (typeof gun.checkSee !== 'function') throw new Error('checkSee');
            if (typeof gun.admitPost !== 'function') throw new Error('admitPost');
            if (typeof gun.checkPost !== 'function') throw new Error('checkPost');
            if (typeof group.MemoryGroupGraph !== 'function') throw new Error('MemoryGroupGraph');
            try {
              await import('sociacl/ir');
              throw new Error('unsigned IR adapter is exported');
            } catch (error) {
              if (error.code !== 'ERR_PACKAGE_PATH_NOT_EXPORTED') throw error;
            }
          "

      - name: Coverage
        run: ./scripts/coverage.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f docs/coverage.md ]]; then
            cat docs/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: |
            docs/coverage.md
            target/coverage/rust-tests.txt
            crates/**/proptest-regressions/**
            target/coverage/rust-summary.txt
            target/coverage/rust.lcov
            target/coverage/python-report.txt
            target/coverage/python.json
            target/coverage/typescript-report.txt
          if-no-files-found: warn

  pack-ids:
    if: startsWith(github.ref, 'refs/tags/ids-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify protected release ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          test "$(gh api "repos/$GH_REPO/branches/master" --jq .protected)" = true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pack identity package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm ci --ignore-scripts --prefix typescript/ids
          version="$(node -p "JSON.parse(require('fs').readFileSync('typescript/ids/package.json')).version")"
          test "$RELEASE_TAG" = "ids-v$version"
          npm run build --prefix typescript/ids
          npm pack --ignore-scripts ./typescript/ids --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" || exit
          sha256sum "sociacl-ids-$version.tgz" > "sociacl-ids-$version.tgz.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: identity-release
          path: |
            ${{ runner.temp }}/sociacl-ids-*.tgz
            ${{ runner.temp }}/sociacl-ids-*.tgz.sha256
          if-no-files-found: error

  release-ids:
    if: startsWith(github.ref, 'refs/tags/ids-v')
    needs: pack-ids
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The write-token job never checks out or executes package source/scripts.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: identity-release
          path: ${{ runner.temp }}/identity-release
      - name: Publish identity release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/identity-release" || exit
          sha256sum --check sociacl-ids-*.tgz.sha256
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            sociacl-ids-*.tgz sociacl-ids-*.tgz.sha256

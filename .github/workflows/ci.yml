name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Check Node 24+
        run: |
          node -v
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Test all languages
        run: ./scripts/test-all.sh

      - name: Coverage
        run: ./scripts/coverage.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f docs/coverage.md ]]; then
            cat docs/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            docs/coverage.md
            target/coverage/rust-summary.txt
            target/coverage/rust.lcov
            target/coverage/python-report.txt
            target/coverage/python.json
            target/coverage/typescript-report.txt
          if-no-files-found: warn

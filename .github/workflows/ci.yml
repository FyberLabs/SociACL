name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["ids-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Public pull_request and push CI must not run on the org self-hosted
    # runner. A fork PR would execute untrusted code on that machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Check Node 24+
        run: |
          node -v
          test "$(node -p "process.versions.node.split('.')[0]")" -ge 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-llvm-cov

      - name: Test all languages
        run: ./scripts/test-all.sh

      - name: Coverage
        run: ./scripts/coverage.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f docs/coverage.md ]]; then
            cat docs/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: |
            docs/coverage.md
            target/coverage/rust-summary.txt
            target/coverage/rust.lcov
            target/coverage/python-report.txt
            target/coverage/python.json
            target/coverage/typescript-report.txt
          if-no-files-found: warn

  release-ids:
    if: startsWith(github.ref, 'refs/tags/ids-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pack identity package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm ci --prefix typescript/ids
          version="$(node -p "JSON.parse(require('fs').readFileSync('typescript/ids/package.json')).version")"
          test "$RELEASE_TAG" = "ids-v$version"
          npm pack ./typescript/ids --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum "sociacl-ids-$version.tgz" > "sociacl-ids-$version.tgz.sha256"
      - name: Publish identity release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            "$RUNNER_TEMP"/sociacl-ids-*.tgz "$RUNNER_TEMP"/sociacl-ids-*.tgz.sha256

[package]
name = "sociacl-encdisc"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "Encrypted-discovery reference slice: account key, blinded rows, epoch admission, rotation, inbox admission, in-place migration"

[features]
# Caller-chosen nonce for the group-epoch wrap. Off in production:
# repeating a group key and a nonce reuses an AES-GCM nonce.
deterministic-wrap = []

[dependencies]
# Keep cryptographic dependency upgrades separate from the time security fix.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["alloc", "aes", "std", "zeroize"] }
hmac = "=0.12.1"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "std", "zeroize"] }
unicode-normalization = "=0.1.24"
base64ct = "=1.6.0"
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "std"] }
rand = "0.8"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "=1.8.1", features = ["alloc"] }
serde_json = "1"
# zxcvbn depends on time. 0.3.47 fixes RUSTSEC-2026-0009 and requires Rust 1.88.
time = "=0.3.47"
zxcvbn = { version = "=3.1.1", default-features = false }
sociacl-gun = { path = "../sociacl-gun" }
sociacl-ids = { path = "../sociacl-ids" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

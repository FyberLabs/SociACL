[package]
name = "sociacl-gun"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GunDB adapter: souls and URL leaves onto SociACL Check and delegate"

[[example]]
name = "gun"
path = "../../examples/gun.rs"

[dependencies]
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
sociacl-core = { path = "../sociacl-core" }
sociacl-ids = { path = "../sociacl-ids" }
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sociacl-ids = { path = "../sociacl-ids" }

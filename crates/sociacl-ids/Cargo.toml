[package]
name = "sociacl-ids"
version = "0.10.0"
# p256/k256 0.14 pull sha2 0.11.1 (Rust 1.88). elliptic-curve 0.14.3 needs Rust 1.87.
rust-version = "1.88"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical identities, path keys and credential proofs"

[dependencies]
# 0.14 follows elliptic-curve 0.14.3, which resolves crypto-bigint >= 0.7.6 (RUSTSEC-2026-0387).
p256 = { version = "=0.14.0", features = ["ecdsa", "arithmetic"] }
k256 = { version = "=0.14.0", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
base64ct = { version = "=1.6.0", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
getrandom = "0.2"
zeroize = { version = "=1.8.1", features = ["alloc"] }

[dev-dependencies]
base64ct = { version = "=1.6.0", features = ["alloc"] }
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }

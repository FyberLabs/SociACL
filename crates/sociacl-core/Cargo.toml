[package]
name = "sociacl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SociACL graph, Check, Remint, Discover/Elect, Destroy"

[[example]]
name = "check"
path = "../../examples/check.rs"

[[example]]
name = "wills"
path = "../../examples/wills.rs"

[dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast", "rand_core", "zeroize"] }
rand = "0.8"
sha2 = "0.10"
thiserror = "2"
# 1.83 cannot parse newer crates that set edition2024.
base64ct = "=1.6.0"
zeroize = "=1.8.1"

[package]
name = "sociacl-c"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C FFI for SociACL verbs, network membership, Case C Client, Social Light, and Gun"

[lib]
name = "sociacl"
